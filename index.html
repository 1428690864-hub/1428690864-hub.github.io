<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<title>第七感知道</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a14;--card:#16162a;--card2:#1d1d38;
  --gold:#d4af37;--gold2:#f0d97a;
  --text:#e8e8f0;--muted:#8888a0;--border:#26264a;
  --green:#4caf7d;--red:#e05a5a;
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#0a0a14;
  background-image:
    radial-gradient(ellipse at 15% 0%,rgba(90,70,160,.25) 0%,transparent 50%),
    radial-gradient(ellipse at 85% 100%,rgba(180,140,60,.14) 0%,transparent 50%),
    radial-gradient(1px 1px at 15% 25%,rgba(255,255,255,.6),transparent),
    radial-gradient(1px 1px at 62% 68%,rgba(255,255,255,.4),transparent),
    radial-gradient(1px 1px at 82% 18%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 38% 88%,rgba(255,255,255,.3),transparent),
    radial-gradient(1px 1px at 92% 52%,rgba(255,255,255,.4),transparent);
  color:var(--text);
  min-height:100vh;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.top-bar{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,20,.85);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:14px 16px;text-align:center;
}
.top-bar h1{
  font-size:17px;font-weight:600;letter-spacing:6px;
  background:linear-gradient(135deg,var(--gold2),var(--gold),#a8862a);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
#app{padding:16px;max-width:960px;margin:0 auto;min-height:calc(100vh - 150px)}
.tab-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;
  background:rgba(16,16,30,.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 0 6px;background:none;border:none;color:var(--muted);
  font-size:10.5px;cursor:pointer;transition:color .2s;
  min-height:54px;font-family:inherit;
}
.tab .ico{font-size:18px;margin-bottom:2px;transition:transform .2s}
.tab.active{color:var(--gold)}
.tab.active .ico{transform:translateY(-1px) scale(1.08)}
h2.sec{font-size:15px;color:var(--gold);margin:22px 0 12px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:3px;height:14px;background:linear-gradient(var(--gold2),var(--gold));border-radius:2px}
.muted{color:var(--muted);font-size:13px;line-height:1.7}
.card{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border:1px solid var(--border);border-radius:14px;padding:16px;
  transition:border-color .2s,transform .1s;
}
.card:active{transform:scale(.985)}
.search{
  width:100%;padding:12px 16px;border-radius:12px;
  background:var(--card);border:1px solid var(--border);
  color:var(--text);font-size:14px;outline:none;font-family:inherit;
  transition:border-color .2s;
}
.search:focus{border-color:var(--gold)}
.search::placeholder{color:#55556e}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12.5px;
  background:var(--card);border:1px solid var(--border);color:var(--muted);
  cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap;
}
.chip.active{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0a0a14;border-color:transparent;font-weight:600}
.card-list{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.card-list{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.card-list{grid-template-columns:repeat(3,1fr)}}
.card-item{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  background:linear-gradient(145deg,var(--card),var(--card2));
  border:1px solid var(--border);border-radius:12px;cursor:pointer;
  transition:border-color .2s,transform .1s;
}
.card-item:active{transform:scale(.98);border-color:var(--gold)}
.card-thumb{
  width:44px;height:62px;flex-shrink:0;border-radius:7px;
  background:linear-gradient(150deg,#252547,#15152b);
  border:1px solid rgba(212,175,55,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
.card-meta{flex:1;min-width:0}
.card-meta h3{font-size:14px;color:var(--gold);margin-bottom:4px;font-weight:600}
.card-meta p{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big-card{
  aspect-ratio:3/5;max-width:220px;margin:0 auto 20px;
  background:linear-gradient(150deg,#252547,#15152b);
  border:1.5px solid rgba(212,175,55,.5);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;box-shadow:0 8px 32px rgba(212,175,55,.15),inset 0 0 40px rgba(90,70,160,.15);
  position:relative;overflow:hidden;
}
.big-card::before{
  content:"";position:absolute;inset:8px;border:1px solid rgba(212,175,55,.2);border-radius:10px;pointer-events:none;
}
.big-card .sym{font-size:52px}
.big-card .nm{font-size:17px;color:var(--gold);letter-spacing:3px;font-weight:600}
.big-card .en{font-size:11px;color:var(--muted);letter-spacing:1px}
.ori-switch{display:flex;gap:8px;margin-bottom:16px}
.ori-btn{
  flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--muted);font-size:13.5px;
  cursor:pointer;transition:all .2s;font-family:inherit;font-weight:500;
}
.ori-btn.active{
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#0a0a14;border-color:transparent;font-weight:600;
  box-shadow:0 4px 16px rgba(212,175,55,.3);
}
.detail-row{
  display:flex;gap:10px;padding:11px 0;border-bottom:1px solid rgba(42,42,74,.6);
  font-size:13.5px;line-height:1.65;
}
.detail-row:last-child{border-bottom:none}
.detail-row .lbl{color:var(--gold);flex-shrink:0;width:44px;font-weight:500}
.detail-row .val{color:var(--text);flex:1}
.btn{
  padding:11px 20px;border-radius:10px;border:none;font-size:13.5px;
  cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s;
}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0a0a14}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text)}
.option{
  display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-size:13.5px;cursor:pointer;font-family:inherit;
  transition:all .2s;line-height:1.5;
}
.option:active{transform:scale(.99)}
.option.correct{background:rgba(76,175,125,.15);border-color:var(--green);color:#9ee8c0}
.option.wrong{background:rgba(224,90,90,.15);border-color:var(--red);color:#f0a0a0}
.option .key{color:var(--gold);font-weight:700;margin-right:8px}
.explain{
  background:linear-gradient(145deg,rgba(212,175,55,.08),rgba(139,122,184,.06));
  border:1px solid rgba(212,175,55,.3);border-radius:14px;
  padding:16px;margin-top:16px;animation:fadeIn .35s ease;
}
.explain h4{color:var(--gold);font-size:13.5px;margin-bottom:10px;letter-spacing:1px}
.explain p{font-size:13px;line-height:1.8;color:#d0d0e0;margin-bottom:8px}
.explain p:last-child{margin-bottom:0}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;transition:width .5s}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 8px;text-align:center;
}
.stat .num{font-size:20px;color:var(--gold);font-weight:700;letter-spacing:1px}
.stat .lb{font-size:11px;color:var(--muted);margin-top:4px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.entry{
  padding:16px 8px;text-align:center;border-radius:12px;
  background:linear-gradient(145deg,var(--card),var(--card2));
  border:1px solid var(--border);cursor:pointer;transition:border-color .2s,transform .1s;
}
.entry:active{transform:scale(.96);border-color:var(--gold)}
.entry .sym{font-size:22px;display:block;margin-bottom:6px}
.entry .nm{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:13.5px;line-height:1.8}
.empty .sym{font-size:40px;display:block;margin-bottom:12px;opacity:.5}
.note-item{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border:1px solid var(--border);border-radius:12px;padding:15px;
  margin-bottom:10px;cursor:pointer;transition:border-color .2s,transform .1s;
}
.note-item:active{transform:scale(.985);border-color:var(--gold)}
.note-item h3{font-size:14px;color:var(--gold);margin-bottom:6px}
.note-item .date{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.note-item .preview{font-size:12.5px;color:#aaaac0;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag{display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;background:rgba(212,175,55,.12);color:var(--gold);border:1px solid rgba(212,175,55,.25);margin-right:6px;margin-top:6px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--gold);margin-bottom:7px;letter-spacing:.5px}
.field input,.field textarea,.field select{
  width:100%;padding:11px 14px;border-radius:10px;
  background:var(--card);border:1px solid var(--border);
  color:var(--text);font-size:13.5px;outline:none;font-family:inherit;
  transition:border-color .2s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:80px;line-height:1.6}
#toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);
  background:rgba(30,30,50,.95);border:1px solid var(--gold);
  color:var(--gold);padding:12px 24px;border-radius:12px;font-size:13.5px;
  z-index:9999;opacity:0;pointer-events:none;transition:all .25s;
  backdrop-filter:blur(10px);white-space:nowrap;
}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.back{
  display:inline-flex;align-items:center;gap:5px;padding:8px 0;
  color:var(--gold);font-size:13.5px;cursor:pointer;background:none;
  border:none;font-family:inherit;margin-bottom:8px;
}
.spread-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.mini-card{
  width:52px;height:74px;border-radius:7px;flex-shrink:0;
  background:linear-gradient(150deg,#252547,#15152b);
  border:1px solid rgba(212,175,55,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:9.5px;color:var(--muted);text-align:center;padding:2px;line-height:1.25;
}
.mini-card .pos{font-size:9px;color:var(--gold);margin-bottom:2px}
.mini-card.rev{transform:rotate(180deg)}
.mini-card.rev .pos{transform:rotate(180deg)}
</style>
</head>
</script>
<body>

<header class="top-bar"><h1>第七感知道</h1></header>

function buildAllCards(){
  const all = MAJOR.map(c=>({
    id:c.id,name:c.name,en:c.en,arcana:"大阿卡纳",suit:"",sym:c.sym,
    element:"",kw:c.kw,up:c.up,rv:c.rv,adv:c.adv,his:c.his
  }));
  let id = 22;
  SUITS.forEach(s=>{
    MINOR[s.key].forEach((m,i)=>{
      const rank = RANKS[i];
      all.push({
        id:id++, name:s.name+rank, en:s.key+" "+(i+1),
        arcana:"小阿卡纳", suit:s.name, sym:s.sym, element:s.element,
        kw:[s.theme, m[0].slice(0,6)],
        up:{g:m[0],l:m[0],c:m[0],f:m[0],h:m[0],s:s.theme},
        rv:{g:m[1],l:m[1],c:m[1],f:m[1],h:m[1],s:"能量受阻"},
        adv:"", his:s.name+"属于"+s.element+"元素，主题是"+s.theme+"。"
      });
    });
  });
  return all;
}

// 根据日期获取今天的句子
function getTodayQuote(){
  const d = new Date();
  const dayIndex = Math.floor(d.getTime() / 86400000);
  return DAILY_QUOTES[dayIndex % DAILY_QUOTES.length];
}

/* ============================================================
   四、存储
   ============================================================ */
const store = {
  get(k,d){try{const v=localStorage.getItem('tarot_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('tarot_'+k,JSON.stringify(v))}catch(e){}}
};

/* ============================================================
   五、工具
   ============================================================ */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.classList.remove('show'),1600);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getCard(id){return ALL_CARDS.find(c=>c.id===id)}

/* ============================================================
   六、路由
   ============================================================ */
let state = {page:'home', params:{}};

function go(page, params={}){
  state.page = page;
  state.params = params || {};
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active',
      t.dataset.page === page ||
      (page==='card-detail'&&t.dataset.page==='cards') ||
      (page==='case-detail'&&t.dataset.page==='cases') ||
      (page==='note-edit'&&t.dataset.page==='notes') ||
      (page==='note-detail'&&t.dataset.page==='notes'));
  });
  render();
  window.scrollTo({top:0,behavior:'instant'});
}

function render(){
  const app = document.getElementById('app');
  const p = state.page;
  if(p==='home') app.innerHTML = viewHome();
  else if(p==='cards') app.innerHTML = viewCards();
  else if(p==='card-detail') app.innerHTML = viewCardDetail();
  else if(p==='cases') app.innerHTML = viewCases();
  else if(p==='case-detail') app.innerHTML = viewCaseDetail();
  else if(p==='notes') app.innerHTML = viewNotes();
  else if(p==='note-edit') app.innerHTML = viewNoteEdit();
  else if(p==='note-detail') app.innerHTML = viewNoteDetail();
  else if(p==='mine') app.innerHTML = viewMine();
  bind();
}

/* ============================================================
   八、牌库
   ============================================================ */
function viewCards(){
  const filter = state.params.filter || '全部';
  const kw = state.params.kw || '';
  let list = ALL_CARDS;
  if(filter==='大阿卡纳') list = list.filter(c=>c.arcana==='大阿卡纳');
  else if(filter!=='全部') list = list.filter(c=>c.suit===filter);
  if(kw){
    const k = kw.toLowerCase();
    list = list.filter(c=>c.name.includes(kw)||c.en.toLowerCase().includes(k)||c.kw.some(x=>x.includes(kw)));
  }
  const filters = ['全部','大阿卡纳','权杖','圣杯','宝剑','星币'];
  const filterHtml = filters.map(f=>
    `<button class="chip ${f===filter?'active':''}" data-filter="${f}">${f}</button>`
  ).join('');

  const listHtml = list.length ? list.map(c=>`
    <div class="card-item" data-go="card-detail" data-id="${c.id}">
      <div class="card-thumb">${c.sym}</div>
      <div class="card-meta">
        <h3>${esc(c.name)}</h3>
        <p>${esc(c.en)} · ${esc(c.kw.join(' / '))}</p>
      </div>
    </div>
  `).join('') : '<div class="empty"><span class="sym">🔍</span>没有找到相关牌</div>';

  return `
    <input class="search" id="cardSearch" placeholder="搜索牌名或关键词…" value="${esc(kw)}" autocomplete="off">
    <div class="filters">${filterHtml}</div>
    <div class="card-list">${listHtml}</div>
  `;
}

function viewCases(){
  const filter = state.params.filter || '全部';
  let list = CASES;
  if(filter==='选择题型') list = list.filter(c=>c.type==='choice');
  else if(filter==='确认题型') list = list.filter(c=>c.type==='reveal');
  else if(filter!=='全部') list = list.filter(c=>c.category===filter);
  const filters = ['全部','选择题型','确认题型','爱情','事业','财运'];
  const filterHtml = filters.map(f=>
    `<button class="chip ${f===filter?'active':''}" data-filter="${f}">${f}</button>`
  ).join('');

  const listHtml = list.length ? list.map(c=>`
    <div class="card-item" data-go="case-detail" data-id="${c.id}">
      <div class="card-thumb" style="font-size:16px">${c.type==='choice'?'❓':'💡'}</div>
      <div class="card-meta">
        <h3>${esc(c.title)}</h3>
        <p>${esc(c.category)} · ${esc(c.spread)} · ${c.type==='choice'?'选择题型':'确认题型'}</p>
      </div>
    </div>
  `).join('') : '<div class="empty"><span class="sym">❖</span>暂无案例</div>';

  return `
    <h2 class="sec">案例库</h2>
    <div class="filters">${filterHtml}</div>
    ${listHtml}
  `;
}

function viewCaseDetail(){
  const id = state.params.id;
  const c = CASES.find(x=>x.id===id);
  if(!c) return '<div class="empty">案例不存在</div>';

  const cardsHtml = c.cards.map(x=>{
    const card = getCard(x.id);
    return `<div class="mini-card ${x.ori==='逆位'?'rev':''}">
      <div class="pos">${esc(x.pos)}</div>
      <div>${card?esc(card.name):''}</div>
      <div style="color:var(--gold)">${esc(x.ori)}</div>
    </div>`;
  }).join('');

  let interactHtml = '';
  if(c.type==='choice'){
    const answered = state.params.answered;
    const chosen = state.params.chosen;
    interactHtml = `<h2 class="sec">你的解读</h2>` +
      c.options.map(o=>{
        let cls = 'option';
        if(answered){
          if(o.k===c.answer) cls += ' correct';
          else if(o.k===chosen) cls += ' wrong';
        }
        return `<button class="${cls}" data-opt="${o.k}" ${answered?'disabled':''}>
          <span class="key">${o.k}</span>${esc(o.t)}
        </button>`;
      }).join('') +
      (answered ? `<div class="explain">
        <h4>${chosen===c.answer?'✓ 回答正确':'✗ 回答错误'}</h4>
        <p><strong>正确答案：</strong>${c.answer}</p>
        <p>${esc(c.explanation)}</p>
        ${c.conclusion?`<p><strong>结论：</strong>${esc(c.conclusion)}</p>`:''}
        ${c.feedback?`<p><strong>后续反馈：</strong>${esc(c.feedback)}</p>`:''}
      </div>` : '');
  } else {
    const revealed = state.params.revealed;
    interactHtml = `<h2 class="sec">先自己想一想</h2>
      <div class="card" style="margin-bottom:14px"><p class="muted">${esc(c.prompt||'点开查看解析')}</p></div>
      <button class="btn btn-gold" id="revealBtn" style="width:100%">${revealed?'收起解析':'查看解析'}</button>
      ${revealed?`<div class="explain">
        <h4>解析</h4>
        <p>${esc(c.explanation)}</p>
        ${c.conclusion?`<p><strong>结论：</strong>${esc(c.conclusion)}</p>`:''}
        ${c.feedback?`<p><strong>后续反馈：</strong>${esc(c.feedback)}</p>`:''}
      </div>`:''}`;
  }

  return `
    <button class="back" data-go="cases">← 返回案例库</button>
    <h2 style="color:var(--gold);font-size:17px;margin-bottom:8px">${esc(c.title)}</h2>
    <div style="margin-bottom:6px">${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    <div class="card" style="margin:14px 0">
      <div class="detail-row"><div class="lbl">问题</div><div class="val">${esc(c.question)}</div></div>

function viewNotes(){
  const notes = store.get('notes',[]);
  if(!notes.length){
    return `<h2 class="sec">我的笔记</h2>
      <div class="empty"><span class="sym">✎</span>还没有笔记<br>点击下方按钮记录你的第一个案例</div>
      <button class="btn btn-gold" data-go="note-edit" style="width:100%;margin-top:10px">+ 新建笔记</button>`;
  }
  const list = notes.map(n=>`
    <div class="note-item" data-go="note-detail" data-id="${n.id}">
      <h3>${esc(n.title)}</h3>
      <div class="date">${esc(n.date)}${n.spread?' · '+esc(n.spread):''}</div>
      <div class="preview">${esc(n.myReading||n.question||'')}</div>
      ${(n.tags||[]).length?`<div>${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
    </div>
  `).join('');
  return `<h2 class="sec">我的笔记</h2>
    <button class="btn btn-gold" data-go="note-edit" style="width:100%;margin-bottom:14px">+ 新建笔记</button>
    ${list}`;
}

      <input id="nTitle" placeholder="例如：今天给自己抽的三牌阵" value="${edit?esc(n.title):''}"></div>
    <div class="field"><label>日期</label>
      <input id="nDate" type="date" value="${edit?esc(n.date):today()}"></div>
    <div class="field"><label>问题</label>

    <div class="field"><label>牌阵</label>

    <div class="field"><label>抽到的牌（用逗号分隔牌名）</label>

    <div class="field"><label>结论</label>

/* ============================================================
   十三、事件绑定
   ============================================================ */
function bind(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>go(t.dataset.page);
  });

  document.querySelectorAll('[data-go]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const page = el.dataset.go;
      const params = {};
      if(el.dataset.id) params.id = isNaN(el.dataset.id)?el.dataset.id:parseInt(el.dataset.id);
      if(el.dataset.filter) params.filter = el.dataset.filter;
      go(page, params);
    };
  });

  const hs = document.getElementById('homeSearch');
  if(hs){
    hs.onkeydown = (e)=>{
      if(e.key==='Enter' && hs.value.trim()){
        go('cards',{kw:hs.value.trim()});
      }
    };
  }

  const cs = document.getElementById('cardSearch');
  if(cs){
    cs.oninput = ()=>{
      state.params.kw = cs.value;
      clearTimeout(cs._tid);
      cs._tid = setTimeout(()=>{
        const app = document.getElementById('app');
        app.innerHTML = viewCards();
        bind();
        const n = document.getElementById('cardSearch');
        if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}
      },250);
    };
  }

  document.querySelectorAll('.chip').forEach(ch=>{
    ch.onclick = ()=>{
      const f = ch.dataset.filter;
      if(state.page==='cards') go('cards',{filter:f,kw:state.params.kw||''});
      else if(state.page==='cases') go('cases',{filter:f});
    };
  });

  document.querySelectorAll('.ori-btn').forEach(b=>{
    b.onclick = ()=>{
      const id = state.params.id;
      go('card-detail',{id,ori:b.dataset.ori});
    };
  });

  const favBtn = document.getElementById('favBtn');
  if(favBtn){
    favBtn.onclick = ()=>{
      const id = state.params.id;
      let fav = store.get('favCards',[]);
      if(fav.includes(id)){
        fav = fav.filter(x=>x!==id);
        toast('已取消收藏');
      } else {
        fav.push(id);
        toast('已收藏');
      }
      store.set('favCards',fav);
      render();
    };
  }

  document.querySelectorAll('[data-opt]').forEach(b=>{
    b.onclick = ()=>{
      const id = state.params.id;
      go('case-detail',{id,answered:true,chosen:b.dataset.opt});
    };
  });

  const rb = document.getElementById('revealBtn');
  if(rb){
    rb.onclick = ()=>{
      const id = state.params.id;
      go('case-detail',{id,revealed:!state.params.revealed});
    };
  }

  const sn = document.getElementById('saveNote');
  if(sn){
    sn.onclick = ()=>{
      const title = document.getElementById('nTitle').value.trim();
      if(!title){toast('请填写标题');return}
      const note = {
        id: state.params.id || ('note_'+Date.now()),
        title,
        date: document.getElementById('nDate').value || today(),
        question: document.getElementById('nQuestion').value.trim(),
        spread: document.getElementById('nSpread').value.trim(),
        cards: document.getElementById('nCards').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean).map(name=>({name})),
        myReading: document.getElementById('nReading').value.trim(),
        conclusion: document.getElementById('nConclusion').value.trim(),
        feedback: document.getElementById('nFeedback').value.trim(),
        tags: document.getElementById('nTags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean)
      };
      let notes = store.get('notes',[]);
      const idx = notes.findIndex(x=>x.id===note.id);
      if(idx>=0) notes[idx]=note; else notes.unshift(note);
      store.set('notes',notes);
      toast('已保存');
      go('note-detail',{id:note.id});
    };
  }

  const dn = document.getElementById('delNote');
  const dn2 = document.getElementById('delNote2');
  const doDel = ()=>{
    if(!confirm('确定删除这条笔记？')) return;
    const id = state.params.id;
    let notes = store.get('notes',[]).filter(x=>x.id!==id);
    store.set('notes',notes);
    toast('已删除');
    go('notes');
  };
  if(dn) dn.onclick = doDel;
  if(dn2) dn2.onclick = doDel;

  const rs = document.getElementById('resetBtn');
  if(rs){
    rs.onclick = ()=>{
      if(!confirm('确定清空所有数据？此操作不可恢复。')) return;
      ['learned','notes','favCards','recent'].forEach(k=>localStorage.removeItem('tarot_'+k));
      toast('已重置');
      go('home');
    };
  }
}
